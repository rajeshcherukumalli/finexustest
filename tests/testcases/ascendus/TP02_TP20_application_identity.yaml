          sba_option_shown: true
      - step: "Select citizenship: No"
        selector: "select[name='citizenship']"
        input: "No"
      - step: "Verify SBA program not available or restricted"
        selector: "select[name='program']"
        expected:
          sba_restricted: true
      - step: "Test configured SBA program fixtures"
        selector: "select[name='program']"
        input: "{{QA_SBA_PROGRAM}}"

    assertions:
      - "No can progress in demonstrated configuration"
      - "SBA restriction follows approved program rule"

  - id: TP18
    title: "Terms Review and Consent Gate"
    priority: P1
    requirement_id: FR06
    test_data_id: TD01, TD02
    basis: Observed
    confirmation: "Q06"
    description: "Verify policy links and consent requirements"

    steps:
      - step: "Open policy links"
        selector: "a[data-testid='policy_link']"
      - step: "Verify links resolve to correct policy documents"
        expected:
          links_functional: true
      - step: "Return to consent form"
      - step: "Scroll through terms"
      - step: "Attempt submission without acceptance"
        selector: "button:has-text('Submit')"
        expected:
          progression_blocked: true
          error: "You must accept the terms to continue"
      - step: "Check consent checkbox"
        selector: "input[type='checkbox'][name='accept_terms']"
      - step: "Click Submit"
        selector: "button:has-text('Submit')"

    assertions:
      - "Links work and open policy documents"
      - "Consent gate prevents progression without acceptance"
      - "Consent record follows approved rules"
      - "Accepted path reaches Additional Details stage"

  - id: TP19
    title: "ECDUP01 Recovery - Identity Duplicate Detection"
    priority: P1
    requirement_id: FR07
    test_data_id: TD06
    basis: Observed
    confirmation: "Q07"
    description: "Verify handling of duplicate SSN/identity errors"

    steps:
      - step: "Submit application with confirmed ECDUP01 error fixture"
        selector: "button:has-text('Submit')"
      - step: "Observe error dialog/toast with support guidance"
        expected:
          error_dialog_shown: true
          message_contains: "duplicate"
      - step: "Click Continue to recover"
        selector: "button:has-text('Continue')"
      - step: "Correct identity field"
        selector: "input[name='ssn']"
        input: "{{CORRECTED_SSN}}"
      - step: "Retry submission"
        selector: "button:has-text('Submit')"

    assertions:
      - "Error identifies failure with support guidance"
      - "Retry preserves form data"
      - "Yields agreed record state without unintended duplicates"

  - id: TP20
    title: "Repeated Intermediate Submission - Duplicate Prevention"
    priority: P1
    requirement_id: FR06, NFR02
    test_data_id: TD06
    basis: Proposed
    confirmation: "Q06, Q19"
    description: "Verify idempotency of form submission and duplicate prevention"

    steps:
      - step: "Fill complete form with TD06 data"
      - step: "Double-click Submit button rapidly"
        selector: "button:has-text('Submit')"
      - step: "Verify only one submission processed"
        expected:
          single_submission: true
      - step: "Retry after response timeout (simulated network delay)"
        wait: "{{NETWORK_TIMEOUT}}"
      - step: "Verify no duplicate records created"
        expected:
          duplicates: 0

    assertions:
      - "No unintended duplicate records created"
      - "Final save state reconciles with LOS"
      - "Retry policy follows approved specification"
